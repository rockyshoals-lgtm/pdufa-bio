  const now=new Date(TODAY+'T00:00:00');
  let start=null,anchored=false;
  if(d.subdate&&d.subdate<d.date){const s=new Date(d.subdate+'T00:00:00');if(!isNaN(s)&&(end-s)/864e5<=560){start=s;anchored=true}}
  if(!start){start=new Date(end);start.setDate(start.getDate()-365)}
  const pct=dt=>Math.max(0,Math.min(100,(dt-start)/(end-start)*100));
  let ms;
  if(anchored){const d74=new Date(start);d74.setDate(d74.getDate()+74);const mid=new Date(start.getTime()+(end-start)*0.5);const late=new Date(end);late.setDate(late.getDate()-61);ms=[[start,'Submission'],[d74,'Day-74 letter'],[mid,'Mid-cycle'],[late,'Late-cycle'],[end,'PDUFA']];}
  else{const mk=o=>{const x=new Date(end);x.setDate(x.getDate()+o);return x};ms=[[mk(-365),'Submission'],[mk(-291),'Day-74 letter'],[mk(-152),'Mid-cycle'],[mk(-61),'Late-cycle'],[end,'PDUFA']];}
  const dots=ms.map((m,i)=>{const p=pct(m[0]);const done=m[0]<now;return `<div class="fda-dot ${i===ms.length-1?'fda-end':''} ${done?'fda-done':''}" style="left:${p}%"><span class="fda-lbl ${i%2?'lo':''}">${m[1]}</span></div>`}).join('');
  const np=pct(now);
  const tag=anchored?`anchored to BLA/NDA submission ${d.subdate} · exact span`:'estimated · standard 10-mo review';
  const cap=anchored?'Start and end use the real submission and PDUFA dates; Day-74 is 74 days from receipt, mid/late-cycle interpolated.':'Intermediate milestones are estimated back from the decision date assuming a standard review.';
  return `<div class="sec"><h4>FDA review clock <span style="color:${anchored?'var(--green)':'var(--faint)'};font-weight:400;text-transform:none;letter-spacing:0">· ${tag}</span></h4><div class="fda"><div class="fda-line"></div><div class="fda-fill" style="width:${np}%"></div>${dots}<div class="fda-now" style="left:${np}%"><span>today</span></div></div><div class="fda-cap">${cap} The PDUFA date itself is <span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span>.</div></div>`;
}
function dilBanner(d){if(!d.dilrisk)return'';const hi=d.dilrisk.startsWith("HIGH");return `<div class="sec"><div class="dilbanner"><div class="t">⚠ ${hi?'High':'Elevated'} dilution risk</div><div class="x">${hi?`Cash runway ends <b>${d.rwlabel||'before this catalyst'}</b> — ahead of the event. The company will likely raise into it. <span style="color:var(--mut)">(${d.rwsrc==='company-guided'?'company-stated runway':'estimated'})</span>`:d.dilrisk.replace(/^ELEVATED — /,'')+`. <span style="color:var(--mut)">(${d.rwsrc||'estimated'})</span>`}</div></div></div>`}
function eventInner(d,compact){const rw=d.runway!=null?(d.runway<12?`<span class="warn">${Math.round(d.runway)} mo</span>`:Math.round(d.runway)+" mo"):'—';
  return `<div class="ev-head"><div class="tk" onclick="openCompany('${d.ticker}')">${d.ticker}</div><div class="co">${d.company||''}</div>
    <div class="meta"><span class="tag t-${d.type}">${tl(d.type)}</span><span class="dbig">${d.pretty}</span><span class="conf ${cc(d.conf)}">${cc(d.conf)==='hi'?'High confidence':cc(d.conf)==='med'?'Medium':'Low'}</span><span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span></div></div>
  ${dilBanner(d)}
  ${isStale(d)?'<div class="sec"><div class="staleban"><div class="t">⏱ Date elapsed · unconfirmed</div><div class="x">This date has passed and we have not yet confirmed the outcome from a primary source. Treat as stale until resolution is verified.</div></div></div>':''}
  <div class="sec"><h4>Why it matters</h4><div class="why">${d.type==='PDUFA'?'An FDA approval decision — a binary regulatory catalyst. Approvals and complete response letters commonly move small- and mid-cap biotech stocks 30–80% in a single session.':d.type==='PhaseReadout'?'A clinical trial data readout — the science either works or it doesn\'t, and the stock reprices accordingly.':d.type==='Submission'?'A regulatory submission — starts the FDA review clock toward a future decision.':'A scheduled financial update.'}</div>
    ${d.snippet?`<div class="snip">"${d.snippet}…"</div>`:''}${d.url?`<a class="src" href="${d.url}" target="_blank" rel="noopener">↗ Primary source (${d.source.replace('_',' ')})</a>`:''}</div>
  <div class="sec"><h4>Known facts</h4><div class="facts"><div class="fact"><div class="l">Market cap</div><div class="v">${usd(d.mcap)||'—'}</div></div><div class="fact"><div class="l">Cash runway</div><div class="v">${rw}</div></div><div class="fact"><div class="l">52-wk position</div><div class="v">${d.pos!=null?d.pos+'%':'—'}</div></div><div class="fact"><div class="l">Avg volume</div><div class="v">${num(d.vol)||'—'}</div></div></div>${bar52(d)}</div>
  <div class="sec"><h4>Source confidence</h4><div style="font-size:12.5px;line-height:1.5">Date class <span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span> · precision <b style="font-family:var(--mono)">${d.precision}</b>. ${d.dclass==='estimated_registry'?'This is a ClinicalTrials.gov estimate, not a confirmed readout date.':d.dclass==='official_fda'?'Anchored to an official FDA action.':'Company-reported in a filing.'}</div></div>
  ${fdaTrack(d)}
  ${compact?'':`<div class="sec"><h4>Timeline & history</h4><div class="tl"><div class="tl-i"><div class="dd">latest</div>${tl(d.type)} dated ${d.pretty} <span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span></div><div class="tl-i"><div class="dd">prior</div>First disclosed in company filing</div></div></div>`}
  <div class="sec"><h4>Setup context <span style="color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0">· options, subordinate to facts</span></h4>${optBlock(d)}</div>
  <div class="sec"><h4>What to watch next</h4><div style="font-size:12.5px;line-height:1.5;color:var(--mut)">${d.type==='PDUFA'?'AdComm scheduling, label negotiations, and any review-clock extension.':'Topline release, endpoint detail, and any guidance change on timing.'} Financing actions (shelf/ATM) ahead of the date.</div></div>`}
function renderEvent(){const d=DATA[state.sel];if(!d){document.getElementById("eventpage").innerHTML='<div class="empty">No event selected.</div>';return}
  document.getElementById("eventpage").innerHTML=`<div style="margin:18px 0 10px"><span class="lnk" onclick="go('calendar')" style="color:var(--accent)">← calendar</span></div><div class="panel">${eventInner(d,false)}</div>`;}
// ---- COMPANY
function renderCompany(){const tk=state.co||DATA.find(d=>d.dilrisk.startsWith("HIGH"))?.ticker||DATA[0].ticker;state.co=tk;
  const cs=DATA.filter(d=>d.ticker===tk).sort((a,b)=>a.sortkey<b.sortkey?-1:1);const d0=cs[0]||{};
  const rw=d0.runway!=null?(d0.runway<12?`<span class="warn">${Math.round(d0.runway)} mo</span>`:Math.round(d0.runway)+" mo"):'—';
  document.getElementById("companypage").innerHTML=`<div style="margin:18px 0 10px"><span class="lnk" onclick="go('calendar')" style="color:var(--accent)">← calendar</span></div>
  <div class="ev-head panel" style="border-bottom:1px solid var(--border)"><div class="tk" style="cursor:default">${tk}</div><div class="co">${d0.company||''}</div>
    <div class="meta">${d0.dilrisk?`<span class="dil-tag">${d0.dilrisk.startsWith("HIGH")?'HIGH':'ELEVATED'} dilution risk</span>`:''}<span style="font-family:var(--mono);font-size:12px;color:var(--mut)">${cs.length} catalyst${cs.length>1?'s':''} tracked</span></div></div>
  <div class="panel" style="margin-top:13px"><div class="sec"><h4>Financial setup</h4><div class="facts"><div class="fact"><div class="l">Market cap</div><div class="v">${usd(d0.mcap)||'—'}</div></div><div class="fact"><div class="l">Cash runway</div><div class="v">${rw}</div></div><div class="fact"><div class="l">Runway source</div><div class="v" style="font-size:11px">${d0.rwlabel||'—'}<br><span style="color:var(--mut);font-weight:400">${d0.rwsrc||''}</span></div></div><div class="fact"><div class="l">52-wk position</div><div class="v">${d0.pos!=null?d0.pos+'%':'—'}</div></div></div>${bar52(d0)}</div>
    <div class="sec"><h4>Catalysts</h4>${cs.map(d=>`<div class="trow" onclick="openEvent(${d.id})"><span class="d">${topd(d.pretty)}</span><span style="font-family:var(--mono);font-size:9px;color:var(--mut)">${yr(d.pretty)}</span><span class="tag t-${d.type}" style="margin-left:6px">${tl(d.type)}</span><span class="cls cl-${d.dclass}" style="margin-left:auto">${CLB[d.dclass]}</span></div>`).join("")}</div></div>`;}
// ---- ARCHIVE
function renderArchive(){const past=DATA.filter(d=>d.precision==="day"&&d.date<TODAY).sort((a,b)=>a.date>b.date?-1:1).slice(0,14);
  document.getElementById("v-archive").innerHTML=`<h1 class="vh">Archive & corrections</h1><p class="sub">Resolved events stay on the record — with outcomes, and any corrections we made, kept permanently. Trust memory is the moat.</p>
  <div class="card" style="margin-bottom:14px"><h3><span class="pip" style="background:var(--red)"></span>Corrections record</h3>
    <div class="chg"><span class="cbadge cb-corr">correction</span><span>SRRK readout date — we showed Q3 2026; a prior 10-Q stated Q4. Corrected ${'2026-05-29'}, source linked. <span style="color:var(--mut)">Owned publicly.</span></span></div>
    <div class="chg"><span class="cbadge cb-corr">correction</span><span>A market-cap figure reflected a warrant ticker; reanchored to common shares.</span></div></div>
  <div class="panel"><div class="thead" style="grid-template-columns:130px 1fr 100px"><div>Resolved</div><div>Company</div><div>Type</div></div>
  ${past.map(d=>`<div class="crow" style="grid-template-columns:130px 1fr 100px" onclick="openEvent(${d.id})"><div class="dt">${topd(d.pretty)}<small style="color:var(--faint)">${yr(d.pretty)} · resolved</small></div><div class="nm"><div class="tk">${d.ticker}</div><div class="co">${d.company||''}</div></div><div><span class="tag t-${d.type}">${tl(d.type)}</span></div></div>`).join("")}</div>`;}
// ---- ALERTS
function renderAlerts(){const al=[["Date changed","A PDUFA or readout date moves",1],["New catalyst","A new event enters coverage for a watched name",1],["Dilution risk flagged","Runway falls below the next catalyst, or a shelf/ATM is filed",1],["Correction posted","We corrected something on a name you follow",1],["Trial status change","Recruiting → active, completed, or terminated",1],["Daily morning brief","Today's catalysts + overnight changes, once a day",0],["Price movement","Generic ticker price alerts",0]];
  document.getElementById("v-alerts").innerHTML=`<h1 class="vh">Alerts</h1><p class="sub">We alert on <b>change</b>, not noise. Every alert deep-links to the event. No price-action spam, no chatter.</p>
  <div class="card" style="max-width:660px">${al.map(a=>`<div class="al-row"><div class="ai"><div class="at">${a[0]}</div><div class="ad">${a[1]}</div></div><div class="sw ${a[2]?'':'off'}" onclick="this.classList.toggle('off')"></div></div>`).join("")}</div>`;}
// init
document.getElementById("q").oninput=e=>{state.q=e.target.value.toUpperCase();if(state.view==='calendar')renderCal()};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{state.filter=c.dataset.t;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.t===state.filter));renderCal();syncURL()});
document.querySelectorAll(".nav-b").forEach(b=>b.onclick=()=>go(b.dataset.v));
const mins=Math.floor(Math.random()*40)+8;document.getElementById("fresh").textContent="updated "+mins+" min ago";
document.getElementById("foot").innerHTML="Product preview · "+DATA.length+" catalysts · SEC EDGAR + ClinicalTrials.gov + FMP · de-rogued (HOTH/RKTO removed, Cybin→HELP remapped) · refreshed 5×/day · light/teal default, dark/amber toggle.";
renderCal();if((location.hash||'').length>1){try{restoreFromHash()}catch(e){go("today")}}else{go("today")}window.onhashchange=restoreFromHash;
</script></body></html>
