const TL={PhaseReadout:"Phase Readout"};const tl=t=>TL[t]||t;
const CLB={official_fda:"FDA official",official_company:"Company filing",estimated_registry:"Registry est.",inferred_internal:"Inferred"};
const TODAY="2026-05-31";
let state={view:"today",sel:null,filter:"All",q:"",co:null};
function usd(v){if(v==null)return null;const a=Math.abs(v);if(a>=1e9)return"$"+(v/1e9).toFixed(1)+"B";if(a>=1e6)return"$"+(v/1e6).toFixed(0)+"M";if(a>=1e3)return"$"+(v/1e3).toFixed(0)+"K";return"$"+v.toFixed(0)}
function num(v){if(v==null)return null;const a=Math.abs(v);if(a>=1e6)return(v/1e6).toFixed(1)+"M";if(a>=1e3)return(v/1e3).toFixed(0)+"K";return""+Math.round(v)}
const cc=c=>c>=.85?"hi":c>=.6?"med":"low";
const topd=p=>p.replace(/,?\s*\d{4}$/,'');const yr=p=>(p.match(/\d{4}$/)||[''])[0];
function toggle(){const h=document.documentElement,d=h.getAttribute("data-theme")==="dark";h.setAttribute("data-theme",d?"light":"dark");document.getElementById("tgb").textContent=d?"◐ dark":"◑ light"}
function go(v){state.view=v;document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));document.getElementById("v-"+v).classList.add("on");document.querySelectorAll(".nav-b").forEach(b=>b.classList.toggle("on",b.dataset.v===v));window.scrollTo(0,0);
  if(v==="today")renderToday();if(v==="archive")renderArchive();if(v==="alerts")renderAlerts();if(v==="company")renderCompany();}
function pickCat(id){state.sel=id;const d=DATA[id];state.co=d.ticker;renderCalDetail();}
function openEvent(id){state.sel=id;renderEvent();go("event");}
function openCompany(tk){state.co=tk;go("company");}
// ---- TODAY
function renderToday(){
  const soon=DATA.filter(d=>d.precision==="day"&&d.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1).slice(0,6);
  const high=DATA.filter(d=>d.dilrisk.startsWith("HIGH")).slice(0,6);
  const bt={};DATA.forEach(d=>bt[d.type]=(bt[d.type]||0)+1);
  const guided=DATA.filter(d=>d.rwsrc==="company-guided").length;
  const chg=`<div class="chg"><span class="cbadge cb-corr">correction</span><span>We corrected an SRRK readout date that a prior filing contradicted — <span class="lnk" style="color:var(--accent)">see why</span></span></div>

  <div class="chg"><span class="cbadge cb-new">new</span><span>A Phase 3 readout was added to coverage</span></div>

  document.getElementById("v-today").innerHTML=`<h1 class="vh">Mission control</h1><p class="sub">What matters today, what changed, and where the dilution risk is — refreshed five times a day.</p>
  <div class="grid3">
    <div class="card"><h3><span class="pip"></span>What matters today</h3>${soon.map(d=>`<div class="trow" onclick="openEvent(${d.id})"><span class="d">${topd(d.pretty)}</span><span class="tk">${d.ticker}</span><span class="ty">${tl(d.type)}</span></div>`).join("")}</div>

      <div class="s"><span>PDUFA dates</span><b>${bt.PDUFA||0}</b></div>
      <div class="s"><span>Phase readouts</span><b>${bt.PhaseReadout||0}</b></div></div></div>

  <div class="card" style="margin-top:14px"><h3><span class="pip" style="background:var(--red)"></span>Dilution watch — runway ends before the catalyst</h3>
    ${high.map(d=>`<div class="dil-row" onclick="openEvent(${d.id})"><span class="dil-tag">HIGH</span><span class="tk" style="font-family:var(--mono);font-weight:600">${d.ticker}</span><span style="color:var(--mut);font-size:11px">${tl(d.type)} · ${d.pretty}</span><span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut)">runway ${d.rwlabel||'< catalyst'}</span></div>`).join("")||'<div class="empty">No HIGH-risk names right now.</div>'}</div>`;
}
// ---- CALENDAR
function filt(){return DATA.filter(d=>(state.filter==="All"||d.type===state.filter)&&(!state.q||d.ticker.toUpperCase().includes(state.q)||(d.company||"").toUpperCase().includes(state.q)))}
function renderCal(){const it=filt();document.getElementById("ccount").textContent=it.length+" catalysts";
  document.getElementById("clist").innerHTML=it.map(d=>{const dot=d.dilrisk.startsWith("HIGH")?'<span class="dot dot-hi" title="dilution risk"></span>':d.dilrisk.startsWith("ELEV")?'<span class="dot dot-el"></span>':'';
    return `<div class="crow ${d.id===state.sel?'sel':''}" onclick="pickCat(${d.id})"><div class="dt">${topd(d.pretty)}<small><span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span></small></div><div class="nm"><div class="tk">${d.ticker}${dot}</div><div class="co">${d.company||''}</div></div><div><span class="tag t-${d.type}">${tl(d.type)}</span></div><div class="mc-cap r">${usd(d.mcap)||'—'}</div></div>`}).join("")||'<div class="empty">No matches.</div>';}
function renderCalDetail(){const d=DATA[state.sel];if(!d){return}
  document.getElementById("cdetail").innerHTML=eventInner(d,true);renderCal();}
// ---- shared event content
function bar52(d){if(d.pos==null)return'';return `<div style="margin-top:11px"><div style="position:relative;height:7px;background:var(--surface2);border:1px solid var(--hair);border-radius:5px"><div style="position:absolute;inset:0 auto 0 0;width:${d.pos}%;background:var(--blue);opacity:.32;border-radius:5px"></div><div style="position:absolute;top:-3px;left:calc(${d.pos}% - 1px);width:3px;height:13px;background:var(--accent);border-radius:2px"></div></div><div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--mut);margin-top:5px"><span>$${d.lo} lo</span><span style="color:var(--accent)">$${d.price} · ${d.pos}%</span><span>$${d.hi} hi</span></div></div>`}
function optBlock(d){const has=d.ivr!=null||d.em!=null||d.dp!=null;if(!has)return '<div class="dashed">Options setup (implied move, IV rank, flow) populates for near-term catalysts on an --options run. Kept separate from source-grounded event truth.</div>';
  return `<div class="optg"><div class="opt"><div class="l">Implied move</div><div class="v">${d.em!=null?'±'+d.em+'%':'—'}</div></div><div class="opt"><div class="l">IV rank</div><div class="v">${d.ivr!=null?Math.round(d.ivr):'—'}</div></div><div class="opt"><div class="l">Flow</div><div class="v">${d.flow||'—'}</div></div><div class="opt"><div class="l">Dark pool</div><div class="v">${usd(d.dp)||'—'}</div></div></div>`}
function dilBanner(d){if(!d.dilrisk)return'';const hi=d.dilrisk.startsWith("HIGH");return `<div class="sec"><div class="dilbanner"><div class="t">⚠ ${hi?'High':'Elevated'} dilution risk</div><div class="x">${hi?`Cash runway ends <b>${d.rwlabel||'before this catalyst'}</b> — ahead of the event. The company will likely raise into it. <span style="color:var(--mut)">(${d.rwsrc==='company-guided'?'company-stated runway':'estimated'})</span>`:d.dilrisk.replace(/^ELEVATED — /,'')+`. <span style="color:var(--mut)">(${d.rwsrc||'estimated'})</span>`}</div></div></div>`}
function eventInner(d,compact){const rw=d.runway!=null?(d.runway<12?`<span class="warn">${Math.round(d.runway)} mo</span>`:Math.round(d.runway)+" mo"):'—';
  return `<div class="ev-head"><div class="tk" onclick="openCompany('${d.ticker}')">${d.ticker}</div><div class="co">${d.company||''}</div>
    <div class="meta"><span class="tag t-${d.type}">${tl(d.type)}</span><span class="dbig">${d.pretty}</span><span class="conf ${cc(d.conf)}">${cc(d.conf)==='hi'?'High confidence':cc(d.conf)==='med'?'Medium':'Low'}</span><span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span></div></div>
  ${dilBanner(d)}
  <div class="sec"><h4>Why it matters</h4><div class="why">${d.type==='PDUFA'?'An FDA decision date — a binary regulatory catalyst that typically drives a large move in the stock.':d.type==='PhaseReadout'?'A clinical trial data readout — the science either works or it doesn\'t, and the stock reprices accordingly.':d.type==='Submission'?'A regulatory submission — starts the FDA review clock toward a future decision.':'A scheduled financial update.'}</div>
    ${d.snippet?`<div class="snip">"${d.snippet}…"</div>`:''}${d.url?`<a class="src" href="${d.url}" target="_blank" rel="noopener">↗ Primary source (${d.source.replace('_',' ')})</a>`:''}</div>
  <div class="sec"><h4>Known facts</h4><div class="facts"><div class="fact"><div class="l">Market cap</div><div class="v">${usd(d.mcap)||'—'}</div></div><div class="fact"><div class="l">Cash runway</div><div class="v">${rw}</div></div><div class="fact"><div class="l">52-wk position</div><div class="v">${d.pos!=null?d.pos+'%':'—'}</div></div><div class="fact"><div class="l">Avg volume</div><div class="v">${num(d.vol)||'—'}</div></div></div>${bar52(d)}</div>
  <div class="sec"><h4>Source confidence</h4><div style="font-size:12.5px;line-height:1.5">Date class <span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span> · precision <b style="font-family:var(--mono)">${d.precision}</b>. ${d.dclass==='estimated_registry'?'This is a ClinicalTrials.gov estimate, not a confirmed readout date.':d.dclass==='official_fda'?'Anchored to an official FDA action.':'Company-reported in a filing.'}</div></div>
  ${compact?'':`<div class="sec"><h4>Timeline & history</h4><div class="tl"><div class="tl-i"><div class="dd">latest</div>${tl(d.type)} dated ${d.pretty} <span class="cls cl-${d.dclass}">${CLB[d.dclass]}</span></div><div class="tl-i"><div class="dd">prior</div>First disclosed in company filing</div></div></div>`}
  <div class="sec"><h4>Setup context <span style="color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0">· options, subordinate to facts</span></h4>${optBlock(d)}</div>
  <div class="sec"><h4>What to watch next</h4><div style="font-size:12.5px;line-height:1.5;color:var(--mut)">${d.type==='PDUFA'?'AdComm scheduling, label negotiations, and any review-clock extension.':'Topline release, endpoint detail, and any guidance change on timing.'} Financing actions (shelf/ATM) ahead of the date.</div></div>`}
function renderEvent(){const d=DATA[state.sel];if(!d){document.getElementById("eventpage").innerHTML='<div class="empty">No event selected.</div>';return}
  document.getElementById("eventpage").innerHTML=`<div style="margin:18px 0 10px"><span class="lnk" onclick="go('calendar')" style="color:var(--accent)">← calendar</span></div><div class="panel">${eventInner(d,false)}</div>`;}
// ---- COMPANY

  document.getElementById("companypage").innerHTML=`<div style="margin:18px 0 10px"><span class="lnk" onclick="go('calendar')" style="color:var(--accent)">← calendar</span></div>

  <div class="panel" style="margin-top:13px"><div class="sec"><h4>Financial setup</h4><div class="facts"><div class="fact"><div class="l">Market cap</div><div class="v">${usd(d0.mcap)||'—'}</div></div><div class="fact"><div class="l">Cash runway</div><div class="v">${rw}</div></div><div class="fact"><div class="l">Runway source</div><div class="v" style="font-size:11px">${d0.rwlabel||'—'}<br><span style="color:var(--mut);font-weight:400">${d0.rwsrc||''}</span></div></div><div class="fact"><div class="l">52-wk position</div><div class="v">${d0.pos!=null?d0.pos+'%':'—'}</div></div></div>${bar52(d0)}</div>
    <div class="sec"><h4>Catalysts</h4>${cs.map(d=>`<div class="trow" onclick="openEvent(${d.id})"><span class="d">${topd(d.pretty)}</span><span style="font-family:var(--mono);font-size:9px;color:var(--mut)">${yr(d.pretty)}</span><span class="tag t-${d.type}" style="margin-left:6px">${tl(d.type)}</span><span class="cls cl-${d.dclass}" style="margin-left:auto">${CLB[d.dclass]}</span></div>`).join("")}</div></div>`;}
