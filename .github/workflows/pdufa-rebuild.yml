name: pdufa daily rebuild

# Deterministic daily refresh of the pdufa.bio data, on GitHub's servers (runs whether or not any
# desktop app is open). It refreshes prices, regenerates the homepage board, runs the CI guards, and
# reconciles against the FDA press-release feed. On success it commits the refreshed data; because the
# Vercel project is Git-connected to this repo, that push auto-deploys.
#
# What it deliberately does NOT do: verify-and-publish a resolved outcome, or auto-add newly discovered
# catalysts. Those need primary-source judgment (an LLM/human) and stay on the supervised path. When the
# reconciliation finds an FDA approval missing from our archive, this opens a GitHub issue so it's caught.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   POLYGON_API_KEY   (price/market-cap refresh)
#   FMP_API_KEY       (optional; only if a step needs it)
# Vercel: connect this repo under the Vercel project -> Git, and set Root Directory = pdufa_site_src.

on:
  schedule:
    - cron: '0 12 * * *'      # 12:00 UTC = 05:00 PT
    - cron: '0 21 * * *'      # 21:00 UTC = 14:00 PT (midday refresh)
  workflow_dispatch: {}         # manual "Run workflow" button in the Actions tab

concurrency:
  group: pdufa-rebuild
  cancel-in-progress: false

permissions:
  contents: write               # commit refreshed data
  issues: write                 # open an issue when reconciliation finds a miss

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests pandas openpyxl python-dateutil

      - name: Refresh prices / market caps (Polygon, forward catalysts only)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python polygon_enrich.py

      - name: Regenerate homepage board (sorted + sparklines + auto-promote)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_home_board.py

      - name: CI guards — BLOCK the run (no commit, no deploy) if any hard-fails
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "::group::$t"; python "$t"; echo "::endgroup::"
          done

      - name: FDA reconciliation (advisory) — approvals not in our archive
        run: python tests/test_fda_reconcile.py --days 30 | tee reconcile.txt

      - name: Detect resolved PDUFAs (advisory) — pending catalysts whose date has passed
        if: ${{ always() }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python check_pdufa_decided.py > decided.txt 2>&1 || true; cat decided.txt

      - name: Open ONE review issue if anything needs primary-source verification
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEED=0
          grep -q "NOT IN ARCHIVE" reconcile.txt && NEED=1
          grep -q "ALREADY DECIDED" decided.txt && NEED=1
          if [ "$NEED" = "1" ]; then
            {
              echo "The server-side rebuild found item(s) needing primary-source verification before publishing."
              echo "(The pipeline never auto-publishes an outcome — that step needs judgment.)"
              echo; echo "## FDA reconciliation — approvals possibly not in our archive"
              echo '```'; cat reconcile.txt; echo '```'
              echo; echo "## Resolved-PDUFA scan — pending catalysts that may have decided"
              echo '```'; cat decided.txt; echo '```'
            } > issue.md
            gh issue create --title "pdufa.bio review: verify + publish ($(date -u +%F))" \
              --body-file issue.md --label "reconciliation" || echo "issue create skipped"
          else
            echo "Nothing needs review this run."
          fi

      - name: Commit refreshed data (Vercel auto-deploys this push)
        run: |
          git config user.name  "pdufa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pdufa_site_src/api/data.js pdufa_site_src/api/v1/dataset.mjs pdufa_site_src/index.html
          if git diff --cached --quiet; then
            echo "no data changes this run — nothing to deploy"
          else
            git commit -m "chore: daily data refresh $(date -u +%F)"
            git push
          fi
