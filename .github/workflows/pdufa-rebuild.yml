name: pdufa daily rebuild

# Deterministic daily refresh of the pdufa.bio data, on GitHub's servers (runs whether or not any
# desktop app is open). It refreshes prices, regenerates the homepage board, runs the CI guards, and
# reconciles against the FDA press-release feed. On success it commits the refreshed data; because the
# Vercel project is Git-connected to this repo, that push auto-deploys.
#
# What it deliberately does NOT do: verify-and-publish a resolved outcome, or auto-add newly discovered
# catalysts. Those need primary-source judgment (an LLM/human) and stay on the supervised path. When the
# reconciliation finds an FDA approval missing from our archive, this opens a GitHub issue so it's caught.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   POLYGON_API_KEY   (price/market-cap refresh)
#   FMP_API_KEY       (optional; only if a step needs it)
# Vercel: connect this repo under the Vercel project -> Git, and set Root Directory = pdufa_site_src.

on:
  schedule:
    - cron: '0 12 * * *'      # 12:00 UTC = 05:00 PT
    - cron: '0 21 * * *'      # 21:00 UTC = 14:00 PT (midday refresh)
  workflow_dispatch: {}         # manual "Run workflow" button in the Actions tab

concurrency:
  group: pdufa-rebuild
  cancel-in-progress: false

permissions:
  contents: write               # commit refreshed data
  issues: write                 # open an issue when reconciliation finds a miss

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        # google-api-python-client + google-auth are only used by ping_search_engines.py to call
        # Search Console sitemaps.submit. Harmless if the GSC_SERVICE_ACCOUNT_JSON secret is not
        # set yet: that step reports itself unconfigured and the run continues.
        run: pip install --quiet requests pandas openpyxl python-dateutil
             google-api-python-client google-auth

      - name: Refresh prices / market caps (Polygon, forward catalysts only)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python polygon_enrich.py

      # ---------------------------------------------------------------------------------------
      # RUN-UP STUDY. The study is the site's proprietary asset, and every decision published and
      # never folded back into it is data the moat does not compound. This block makes that
      # automatic: extend from the decision archive, compute the T-120 baseline for whatever is
      # new, recompute the published statistics, then push those numbers into every page that
      # quotes them. Runs BEFORE the homepage board so the headline count is same-day, not a day
      # behind. Every step is incremental and idempotent; a day with no new decisions is a no-op.
      # ---------------------------------------------------------------------------------------
      - name: "Run-up study: fold in newly decided PDUFAs"
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python extend_runup_study.py

      - name: "Run-up study: compute T-120 baseline for new events only"
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python add_t120_baseline.py

      - name: "Run-up study: recompute the published statistics (single source of truth)"
        run: python runup_study_stats.py

      - name: "Run-up study: refresh cohort figures quoted on every decision page"
        run: python refresh_cohort_figures.py

      - name: "Run-up study: rebuild /runup-by-year from the master dataset"
        run: python build_runup_by_year.py

      - name: Regenerate homepage board (sorted + sparklines w/ decision-day reaction + auto-promote)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_home_board.py

      - name: Mark decided PDUFAs on the calendar pages (idempotent)
        run: python mark_calendar_decided.py

      - name: Keep /decisions newest-first + year counters honest
        run: python fix_decisions_order.py

      - name: Sync the v1 API to the published pages (kills API/page drift)
        run: python sync_api_from_pages.py

      - name: Repair Event schema (location + datetime/TZ startDate)
        run: python fix_event_schema.py

      - name: Regenerate sitemap from live pages (real lastmod, no stale list)
        run: python build_sitemap.py

      - name: Mine readout dates (enrollment-complete trials only; no enrolling trials)
        continue-on-error: true          # advisory data source: never block the deploy
        run: python readout_miner.py

      - name: Refresh /readouts (drop past months + auto-log readout window moves)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_readout_results.py

      # /sls asserts that the 80th REGAL event has not been announced. That is a claim of absence,
      # so its date is advanced by EDGAR evidence, never by the clock. If SELLAS files anything
      # material this step exits non-zero, the date stays frozen, and the page keeps saying what it
      # was last able to verify until a human reads the filing.
      - name: "SLS: verify the 'not yet announced' claim against EDGAR"
        id: sls
        continue-on-error: true
        run: python check_sls_filings.py

      # Collect the day's primary-source activity: EDGAR filings (with the 8-K/exhibit text read,
      # not just the form type), SELLAS's own press releases, executive quotes lifted verbatim,
      # and the close/volume. Append-only, so nothing already published is rewritten.
      - name: "SLS: collect filings, press releases, quotes and price"
        continue-on-error: true          # a bad day at EDGAR must not block the whole deploy
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sls_daily.py

      - name: "SLS: rebuild the tracker pages (only if the claim still verifies)"
        if: steps.sls.outcome == 'success'
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python build_sls_hub.py
          python build_sls_deepdive.py

      - name: "SLS: flag for manual review (material filing found)"
        if: steps.sls.outcome != 'success'
        run: echo "::warning::SELLAS filed something material. /sls dates were NOT advanced. Review the filing and update _sls_verified_through.json."

      # Ticker hubs: name the company (SEC's own ticker file), carry the assets we hold, and never
      # repeat a price-inferred outcome with a verified badge. Also noindexes hubs with nothing
      # verified to show, so we stop asking Google to rank empty pages.
      - name: Rebuild the VKTX tracker (measured reactions from daily closes)
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_vktx_hub.py

      - name: Surface company-guided readouts at the top of /readouts
        run: python build_guided_readouts.py

      - name: Entity-enrich the ticker hubs
        run: python enrich_ticker_hubs.py

      # Normalisers run AFTER every generator. Generators own the data; these own the house style,
      # so a page regenerated tomorrow cannot silently revert to the old disclaimer or reintroduce
      # em dashes. Both are idempotent.
      - name: Normalise copy (remove em dashes used as punctuation)
        run: python strip_dashes.py

      - name: Apply the canonical legal footer to every page
        run: python apply_legal_footer.py

      - name: Currency audit (advisory) — anything stale anywhere on the site
        continue-on-error: true
        run: python audit_currency.py

      - name: CI guards — BLOCK the run (no commit, no deploy) if any hard-fails
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "::group::$t"; python "$t"; echo "::endgroup::"
          done

      - name: FDA reconciliation (advisory) — approvals not in our archive
        run: python tests/test_fda_reconcile.py --days 30 | tee reconcile.txt

      - name: Detect resolved PDUFAs (advisory) — pending catalysts whose date has passed
        if: ${{ always() }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python check_pdufa_decided.py > decided.txt 2>&1 || true; cat decided.txt

      - name: Detect AdComm meetings needing a vote result (advisory)
        if: ${{ always() }}
        run: python check_adcom_results.py > adcom.txt 2>&1 || true; cat adcom.txt

      - name: Detect readouts needing exact date + outcome (advisory)
        if: ${{ always() }}
        run: python check_readouts_reported.py > readouts.txt 2>&1 || true; cat readouts.txt

      - name: Open ONE review issue if anything needs primary-source verification
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEED=0
          grep -q "NOT IN ARCHIVE" reconcile.txt && NEED=1
          grep -q "ALREADY DECIDED" decided.txt && NEED=1
          grep -q "ADCOM NEEDS RESULT" adcom.txt && NEED=1
          grep -q "READOUT NEEDS VERIFICATION" readouts.txt && NEED=1
          if [ "$NEED" = "1" ]; then
            {
              echo "The server-side rebuild found item(s) needing primary-source verification before publishing."
              echo "(The pipeline never auto-publishes an outcome — that step needs judgment.)"
              echo; echo "## FDA reconciliation — approvals possibly not in our archive"
              echo '```'; cat reconcile.txt; echo '```'
              echo; echo "## Resolved-PDUFA scan — pending catalysts that may have decided"
              echo '```'; cat decided.txt; echo '```'
              echo; echo "## AdComm meetings past-date with no published vote result"
              echo '```'; cat adcom.txt; echo '```'
              echo; echo "## Readouts whose window closed last month (confirm exact date + outcome to upgrade)"
              echo '```'; cat readouts.txt; echo '```'
            } > issue.md
            gh issue create --title "pdufa.bio review: verify + publish ($(date -u +%F))" \
              --body-file issue.md --label "reconciliation" || echo "issue create skipped"
          else
            echo "Nothing needs review this run."
          fi

      - name: Commit refreshed data (Vercel auto-deploys this push)
        run: |
          git config user.name  "pdufa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pdufa_site_src/api/data.js pdufa_site_src/api/v1/dataset.mjs pdufa_site_src/index.html pdufa_site_src/calendar pdufa_site_src/readouts/index.html pdufa_site_src/decisions/index.html pdufa_site_src/adcomm/index.html pdufa_site_src/sitemap.xml pdufa_site_src/ticker pdufa_site_src/sls pdufa_site_src/research
          git add -f readout_miner.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no data changes this run — nothing to deploy"
          else
            git commit -m "chore: daily data refresh $(date -u +%F)"
            git push
          fi

      # Tell the search engines, AFTER Vercel has had a moment to build the pushed commit.
      # Note: the classic sitemap ping is gone. google.com/ping returns 404 "deprecated" and
      # bing.com/ping returns 410, both verified live. IndexNow is the only working push channel
      # (Bing/Yandex/Seznam/Naver); Google's supported route is the Search Console API, which needs
      # the GSC_SERVICE_ACCOUNT_JSON secret. Without it this step says so rather than pretending.
      - name: Ping search engines (IndexNow + Search Console)
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          sleep 60
          python ping_search_engines.py
