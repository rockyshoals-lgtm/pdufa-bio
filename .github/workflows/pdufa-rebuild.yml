name: pdufa daily rebuild

# Deterministic daily refresh of the pdufa.bio data, on GitHub's servers (runs whether or not any
# desktop app is open). It refreshes prices, regenerates the homepage board, runs the CI guards, and
# reconciles against the FDA press-release feed. On success it commits the refreshed data; because the
# Vercel project is Git-connected to this repo, that push auto-deploys.
#
# What it deliberately does NOT do: verify-and-publish a resolved outcome, or auto-add newly discovered
# catalysts. Those need primary-source judgment (an LLM/human) and stay on the supervised path. When the
# reconciliation finds an FDA approval missing from our archive, this opens a GitHub issue so it's caught.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   POLYGON_API_KEY   (price/market-cap refresh)
#   FMP_API_KEY       (optional; only if a step needs it)
# Vercel: connect this repo under the Vercel project -> Git, and set Root Directory = pdufa_site_src.

on:
  schedule:
    - cron: '0 12 * * *'      # 12:00 UTC = 05:00 PT
    - cron: '0 21 * * *'      # 21:00 UTC = 14:00 PT (midday refresh)
  workflow_dispatch: {}         # manual "Run workflow" button in the Actions tab

concurrency:
  group: pdufa-rebuild
  cancel-in-progress: false

permissions:
  contents: write               # commit refreshed data
  issues: write                 # open an issue when reconciliation finds a miss

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        # google-api-python-client + google-auth are only used by ping_search_engines.py to call
        # Search Console sitemaps.submit. Harmless if the GSC_SERVICE_ACCOUNT_JSON secret is not
        # set yet: that step reports itself unconfigured and the run continues.
        run: pip install --quiet requests pandas openpyxl python-dateutil
             google-api-python-client google-auth

      - name: Refresh prices / market caps (Polygon, forward catalysts only)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python polygon_enrich.py

      # ---------------------------------------------------------------------------------------
      # RUN-UP STUDY. The study is the site's proprietary asset, and every decision published and
      # never folded back into it is data the moat does not compound. This block makes that
      # automatic: extend from the decision archive, compute the T-120 baseline for whatever is
      # new, recompute the published statistics, then push those numbers into every page that
      # quotes them. Runs BEFORE the homepage board so the headline count is same-day, not a day
      # behind. Every step is incremental and idempotent; a day with no new decisions is a no-op.
      # ---------------------------------------------------------------------------------------
      - name: "Run-up study: fold in newly decided PDUFAs"
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python extend_runup_study.py

      - name: "Run-up study: compute T-120 baseline for new events only"
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python add_t120_baseline.py

      - name: "Run-up study: recompute the published statistics (single source of truth)"
        run: python runup_study_stats.py

      - name: "Run-up study: refresh cohort figures quoted on every decision page"
        run: python refresh_cohort_figures.py

      - name: "Run-up study: rebuild /runup-by-year from the master dataset"
        run: python build_runup_by_year.py

      - name: Regenerate homepage board (sorted + sparklines w/ decision-day reaction + auto-promote)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_home_board.py

      # Reconcile the calendar against the slate BEFORE marking outcomes, so a catalyst added here
      # is marked in the same run. REPL had a confirmed date, an adcomm page and a slate row, and
      # appeared on no calendar page at all; 42 dated PDUFAs were missing the same way.
      - name: Add any dated PDUFA missing from the calendar
        run: python ensure_calendar_rows.py

      - name: Mark decided PDUFAs on the calendar pages (idempotent)
        run: python mark_calendar_decided.py

      # Comparator arms captured as the sponsor's own drug. BMY's title read "Bevacizumab", a
      # Roche product, because the CT.gov ingest took whichever intervention it saw first.
      - name: "Data quality: resolve comparator names against the trial record"
        continue-on-error: true
        run: python fix_comparator_names.py

      - name: Keep /decisions newest-first + year counters honest
        run: python fix_decisions_order.py

      # Recompute the archive's provenance split from the pages. The old claim counted 116 pages
      # with no source at all as "verified with a primary source".
      - name: "Publish the honest sourced / inferred / unsourced split"
        run: python refresh_provenance_counts.py

      - name: Sync the v1 API to the published pages (kills API/page drift)
        run: python sync_api_from_pages.py

      - name: Repair Event schema (location + datetime/TZ startDate)
        run: python fix_event_schema.py

      - name: Regenerate sitemap from live pages (real lastmod, no stale list)
        run: python build_sitemap.py

      # Bounded on purpose. The default run also walks 411 CT.gov sponsors sequentially, which is
      # the stage that rate-limits and can take 20+ minutes, delaying the deploy for a data source
      # that is advisory. The daily job takes the fast EDGAR pass; the exhaustive sweep stays on the
      # manual Readout_Miner_DEEP.bat, whose output is verified before anything is published.
      - name: Mine readout dates (bounded EDGAR pass; deep sweep is manual)
        continue-on-error: true          # advisory data source: never block the deploy
        timeout-minutes: 12
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python readout_miner.py --source edgar --edgar-days 30 --edgar-docs 200

      # Free subscribable calendar. Deliberately a STATIC file, not the Pro-gated /api/v1/calendar.ics,
      # so this costs the paid API tiering nothing. Runs after the dataset sync so the feed matches
      # the published pages, and before the normalisers so its injected copy gets swept like any other.
      - name: "Calendar: rebuild the free subscribable .ics feed"
        run: python build_calendar_feed.py

      - name: Refresh /readouts (drop past months + auto-log readout window moves)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_readout_results.py

      # /sls asserts that the 80th REGAL event has not been announced. That is a claim of absence,
      # so its date is advanced by EDGAR evidence, never by the clock. If SELLAS files anything
      # material this step exits non-zero, the date stays frozen, and the page keeps saying what it
      # was last able to verify until a human reads the filing.
      - name: "SLS: verify the 'not yet announced' claim against EDGAR"
        id: sls
        continue-on-error: true
        run: python check_sls_filings.py

      # Collect the day's primary-source activity: EDGAR filings (with the 8-K/exhibit text read,
      # not just the form type), SELLAS's own press releases, executive quotes lifted verbatim,
      # and the close/volume. Append-only, so nothing already published is rewritten.
      - name: "SLS: collect filings, press releases, quotes and price"
        continue-on-error: true          # a bad day at EDGAR must not block the whole deploy
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sls_daily.py

      - name: "SLS: rebuild the tracker pages (only if the claim still verifies)"
        if: steps.sls.outcome == 'success'
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python build_sls_hub.py
          python build_sls_deepdive.py
          python build_sls_ownership.py

      - name: "SLS: flag for manual review (material filing found)"
        if: steps.sls.outcome != 'success'
        run: echo "::warning::SELLAS filed something material. /sls dates were NOT advanced. Review the filing and update _sls_verified_through.json."

      # Ticker hubs: name the company (SEC's own ticker file), carry the assets we hold, and never
      # repeat a price-inferred outcome with a verified badge. Also noindexes hubs with nothing
      # verified to show, so we stop asking Google to rank empty pages.
      - name: Rebuild the VKTX tracker (measured reactions from daily closes)
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_vktx_hub.py

      - name: Surface company-guided readouts at the top of /readouts
        run: python build_guided_readouts.py

      - name: Entity-enrich the ticker hubs
        run: python enrich_ticker_hubs.py

      # Runs AFTER the hub generator so a regeneration cannot re-orphan the deep dives. /vktx was
      # live and in the sitemap for a day with nothing linking to it, which is the same as not
      # having shipped it.
      # Researched, plain-English deep dives injected into the existing ticker hubs. Runs after the
      # hub generator so it is never overwritten, and re-measures every stock reaction from daily
      # closes so the published moves cannot drift from what happened.
      - name: Rebuild the retail deep dives (plain English, measured reactions)
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_retail_pages.py

      # Per-stock T-120 figures, measured from that ticker's own daily closes on the same basis as
      # the cohort study. Also lifts the noindex on hubs that are no longer thin.
      - name: Rebuild per-stock run-up (measured, small-n disclosed)
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python build_stock_runup.py

      - name: Keep the featured deep dives linked (no orphan pages)
        run: python link_featured_pages.py

      # Normalisers run AFTER every generator. Generators own the data; these own the house style,
      # so a page regenerated tomorrow cannot silently revert to the old disclaimer or reintroduce
      # em dashes. Both are idempotent.
      # One nav on every page. There were eight different navs across 858 pages, so which site you
      # could reach depended on where Google landed you. Runs with the other normalisers so a
      # regenerated page cannot revert to an old nav.
      # Both of these write into index.html, so they MUST run after build_home_board regenerates it,
      # or the board rebuild would silently wipe them. They sit here with the normalisers for that
      # reason.
      # Who has SAID they are presenting, from their own SEC filings, months before organisers
      # publish abstract titles. Bounded and advisory; the page states it is not the full programme.
      - name: "Conferences: mine presenter announcements from EDGAR"
        continue-on-error: true
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python conference_presenter_miner.py --days 240

      - name: "Conferences: rebuild the calendar and presenter lists"
        run: python build_conferences.py

      - name: Explain what a PDUFA date is (plain English + FAQ schema)
        run: python build_explainer.py

      - name: Rebuild instant search index (no model, no API)
        run: python build_search.py

      # Competitive: the long tail is uncontested because no competitor has a per-event URL at all.
      # These three make ours reachable, answerable and visibly fresher than a rival shipping
      # "Synced 1w ago".
      - name: "Crawl paths: link the ticker hubs from every catalyst list"
        run: python add_ticker_crosslinks.py

      - name: "Answers: FAQ + FAQPage schema on every ticker hub"
        run: python build_ticker_faq.py

      # GSC: every non-branded click ever earned came from a drug-name query; two of the three
      # had no page. This is the surface for the queries we can prove convert.
      - name: "Drug pages (/drug/{name}) from dataset + decisions archive"
        run: python build_drug_pages.py

      - name: "Noindex empty calendar months (both directions)"
        run: python noindex_empty_months.py

      - name: "Answer-first lede above every hub table"
        run: python build_hub_lede.py

      # Bing flagged both of these on /sls. Runs before the final sitemap because titles and
      # descriptions are real page content, so a change to them should advance lastmod.
      - name: "Fit titles and meta descriptions to what a search result shows"
        run: python fix_meta_lengths.py

      - name: Normalise navigation (one nav, site-wide)
        run: python rebuild_nav.py

      - name: Normalise copy (remove em dashes used as punctuation)
        run: python strip_dashes.py

      - name: Apply the canonical legal footer to every page
        run: python apply_legal_footer.py

      - name: Currency audit (advisory) — anything stale anywhere on the site
        continue-on-error: true
        run: python audit_currency.py

      # Rebuilt again here, after the normalisers: build_stock_runup lifts the noindex on hubs that
      # gained real content, and those pages only belong in the sitemap once that has happened.
      - name: Regenerate sitemap after normalisers (picks up newly indexable pages)
        run: python build_sitemap.py

      # Must follow build_sitemap.py, not precede it. The stamp prints each page's real
      # content-change date and build_sitemap.py is what computes that; running it first would
      # stamp the previous build's answer. Safe to run after the sitemap is written because the
      # stamp is stripped from the content hash, so it cannot alter the lastmod we just published.
      - name: "Freshness stamp (dated from real content changes, crawler-visible)"
        run: python build_freshness_stamp.py

      # Same date, in the form search engines actually read to print a timestamp beside a result.
      # Also after the sitemap, and also stripped from the content hash, for the same reason.
      - name: "dateModified in schema + og/article modified-time"
        run: python build_date_modified.py

      - name: CI guards — BLOCK the run (no commit, no deploy) if any hard-fails
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "::group::$t"; python "$t"; echo "::endgroup::"
          done

      - name: FDA reconciliation (advisory) — approvals not in our archive
        run: python tests/test_fda_reconcile.py --days 30 | tee reconcile.txt

      - name: Detect resolved PDUFAs (advisory) — pending catalysts whose date has passed
        if: ${{ always() }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python check_pdufa_decided.py > decided.txt 2>&1 || true; cat decided.txt

      - name: Detect AdComm meetings needing a vote result (advisory)
        if: ${{ always() }}
        run: python check_adcom_results.py > adcom.txt 2>&1 || true; cat adcom.txt

      - name: Detect readouts needing exact date + outcome (advisory)
        if: ${{ always() }}
        run: python check_readouts_reported.py > readouts.txt 2>&1 || true; cat readouts.txt

      - name: Open ONE review issue if anything needs primary-source verification
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEED=0
          grep -q "NOT IN ARCHIVE" reconcile.txt && NEED=1
          grep -q "ALREADY DECIDED" decided.txt && NEED=1
          grep -q "ADCOM NEEDS RESULT" adcom.txt && NEED=1
          grep -q "READOUT NEEDS VERIFICATION" readouts.txt && NEED=1
          if [ "$NEED" = "1" ]; then
            {
              echo "The server-side rebuild found item(s) needing primary-source verification before publishing."
              echo "(The pipeline never auto-publishes an outcome — that step needs judgment.)"
              echo; echo "## FDA reconciliation — approvals possibly not in our archive"
              echo '```'; cat reconcile.txt; echo '```'
              echo; echo "## Resolved-PDUFA scan — pending catalysts that may have decided"
              echo '```'; cat decided.txt; echo '```'
              echo; echo "## AdComm meetings past-date with no published vote result"
              echo '```'; cat adcom.txt; echo '```'
              echo; echo "## Readouts whose window closed last month (confirm exact date + outcome to upgrade)"
              echo '```'; cat readouts.txt; echo '```'
            } > issue.md
            gh issue create --title "pdufa.bio review: verify + publish ($(date -u +%F))" \
              --body-file issue.md --label "reconciliation" || echo "issue create skipped"
          else
            echo "Nothing needs review this run."
          fi

      - name: Commit refreshed data (Vercel auto-deploys this push)
        run: |
          git config user.name  "pdufa-bot"
          git config user.email "bot@users.noreply.github.com"
          # The run-up study's own artifacts MUST be committed alongside the pages that quote them.
          # They were not, and the result was a repo that contradicted itself: each run grew the
          # study to 1,829 events, stamped that on the homepage, passed its guards (everything
          # agreed inside the runner), then committed the homepage and discarded the study. The
          # committed stats file stayed on 1,827, so a fresh checkout failed its own guard while CI
          # went on passing, because CI regenerates the study before the guard runs. It also meant
          # the study never actually persisted its growth: every run redid the same work.
          git add pdufa_site_src/api/data.js pdufa_site_src/api/v1/dataset.mjs pdufa_site_src/index.html pdufa_site_src/calendar pdufa_site_src/readouts/index.html pdufa_site_src/decisions/index.html pdufa_site_src/adcomm/index.html pdufa_site_src/sitemap.xml pdufa_site_src/ticker pdufa_site_src/sls pdufa_site_src/research pdufa_site_src/conferences pdufa_site_src/tickers pdufa_site_src/calendar.ics pdufa_site_src/search-index.json
          git add runup_study_stats.json pdufa_runup_bifrost_v2.csv runup_t120_short.json _sitemap_lastmod.json
          git add catalysts_out/conference_presenters_mined.csv 2>/dev/null || true
          git add -f readout_miner.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no data changes this run — nothing to deploy"
          else
            git commit -m "chore: daily data refresh $(date -u +%F)"
            git push
          fi

      # Tell the search engines, AFTER Vercel has had a moment to build the pushed commit.
      # Note: the classic sitemap ping is gone. google.com/ping returns 404 "deprecated" and
      # bing.com/ping returns 410, both verified live. IndexNow is the only working push channel
      # (Bing/Yandex/Seznam/Naver); Google's supported route is the Search Console API, which needs
      # the GSC_SERVICE_ACCOUNT_JSON secret. Without it this step says so rather than pretending.
      - name: Ping search engines (IndexNow + Bing SubmitUrlBatch + Search Console)
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # SubmitUrlBatch: the quota-backed Bing channel (~100/day, we were using 12). Same key
          # as the rank reporter; the JSON protocol it uses survives the Aug 31 SOAP/POX cut.
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          sleep 60
          python ping_search_engines.py

      # Bing is where we actually rank, and GSC cannot see it. Advisory: no key, no failure.
      - name: "Bing rank snapshot (advisory)"
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: python bing_rank_report.py
