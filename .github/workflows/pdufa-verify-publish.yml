name: pdufa verify + publish (LLM)

# Autonomous outcome-publisher. Runs Claude on a schedule to close the one gap a plain cron can't:
# verifying a resolved FDA outcome against a PRIMARY source and publishing it. Owner chose
# auto-publish-to-live, so this commits to main (Vercel auto-deploys) WITHOUT a human merge — but
# only behind hard rails: primary-source confirmation, the full 13-guard suite must pass (it reverts
# its own edits if any fail), it may only touch the flagged tickers, and it opens an audit issue for
# every publish so nothing goes live silently.
#
# KILL SWITCH: disable this workflow in the Actions tab, or delete this file. Every change it makes is
# a normal git commit by the bot — revertable with `git revert <sha>` (Vercel redeploys the revert).
#
# PREREQUISITES (owner, one-time):
#   1. Install the Claude GitHub App on this repo:  claude /install-github-app
#   2. Repo secrets: ANTHROPIC_API_KEY (Anthropic API acct w/ billing), FMP_API_KEY, POLYGON_API_KEY

on:
  schedule:
    - cron: '0 13 * * *'      # 13:00 UTC = 06:00 PT, after the 12:00 deterministic rebuild
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pdufa-verify-publish
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - run: pip install --quiet requests pandas openpyxl python-dateutil

      - name: Claude — verify flagged outcomes against primary sources, publish only if guards pass
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        with:
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          claude_args: "--max-turns 30 --model claude-opus --append-system-prompt 'HARD RULES, no exceptions: (1) Publish an outcome ONLY if it is confirmed by a PRIMARY source — the sponsoring company''s own press release / IR page, or an FDA or SEC filing. News aggregators (e.g. aijourn) do NOT count; a passed PDUFA date is NOT evidence of an outcome. (2) If you cannot confirm from a primary source, DO NOT edit anything — open an issue and stop. (3) You may only add/modify the specific flagged ticker(s); never touch unrelated catalysts. (4) Never invent a drug, date, ticker, sponsor, indication, or outcome. Every published value must carry its primary-source URL. (5) After editing, run every tests/test_*.py; if ANY exits non-zero, run \"git checkout -- .\" to discard ALL your edits, open an issue explaining the guard failure, and stop — do NOT commit. (6) Commit to main ONLY when guards pass AND a primary source is cited.'"
          prompt: |
            You are the autonomous outcome-publisher for pdufa.bio. Work in the repo root.

            STEP 1 — DETECT what needs a decision:
              python tests/test_fda_reconcile.py --days 30   (FDA approvals possibly not in our archive)
              python check_pdufa_decided.py                    (pending PDUFAs whose date has passed)
            If both are clean (no "NOT IN ARCHIVE", no "ALREADY DECIDED"): print "nothing to publish" and STOP.

            STEP 2 — VERIFY each flagged item against a PRIMARY source (WebSearch + WebFetch): the
            company's own press release / IR page, or an FDA/SEC filing. Determine outcome
            (Approved / CRL / Withdrawn) and the actual decision date. If you cannot confirm from a
            primary source, do NOT edit — note it for an issue and move on.

            STEP 3 — PUBLISH each CONFIRMED item (and only the confirmed, flagged tickers):
              - pdufa_site_src/api/v1/dataset.mjs: set the record st="Decided", add oc="<Approved|CRL|Withdrawn>"
                and dcd="<YYYY-MM-DD actual decision date>"; if it's a brand-new approval with no record, add one
                (type "PDUFA", with url = the primary-source URL). If it was a forward catalyst, also remove it
                from the forward SLATE in pdufa_site_src/api/data.js.
              - pdufa_site_src/decisions/index.html: add the archive row (ticker, decision date, ✓/✕, outcome, drug).
              - Create pdufa_site_src/fda-decision/<TICKER>-<decision-date>/index.html (copy the shape of an
                existing recent decision page; facts + primary-source link only; no fabricated chart).
              - Run: python build_home_board.py

            STEP 4 — GATE: run  for t in tests/test_*.py; do python "$t" || FAIL=1; done
              If any guard failed: git checkout -- . (discard everything), open an issue titled
              "verify-publish: guard failure" with details, and STOP (no commit).

            STEP 5 — COMMIT + AUDIT (only if guards passed): commit to main
              (message "publish: <TICKER> <outcome> <date> [auto, primary-source verified]") and push.
              Then open an issue titled "Auto-published: <TICKER> <outcome>" documenting exactly what you
              changed and the primary-source URL(s) — this is the audit trail for every live change.

            If nothing was confirmable, open a single issue listing what you checked and why it wasn't published.
