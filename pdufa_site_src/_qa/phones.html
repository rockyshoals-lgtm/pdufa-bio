<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>QA phones (temporary, not for production)</title>
<style>body{margin:0;background:#fff;color:#000;font:13px/1.4 monospace}iframe{border:1px solid #888;display:block;background:#000}#out{white-space:pre-wrap;padding:6px}</style></head><body>
<div id="out">running…</div><div id="box"></div><p style="font-size:11px">Temporary layout test page. Not affiliated with or endorsed by the FDA. Not investment advice; pdufa.bio is not a registered investment adviser.</p>
<script>
var P=new URLSearchParams(location.search);
var view=P.get('view');
if(view){var w=+(P.get('w')||375),h=+(P.get('h')||1800),y=+(P.get('y')||0);var f=document.createElement('iframe');f.width=w;f.height=h;f.src=view;
 f.onload=function(){try{f.contentWindow.scrollTo(0,y)}catch(e){}};document.getElementById('box').appendChild(f);document.getElementById('out').textContent=view+' @ '+w+'px';}
else{
var pages=(P.get('pages')||'/,/calendar,/decisions,/screener,/readouts,/runup-by-year,/research/conference-runup,/crl,/patent-cliff/exclusivity,/fda-approval-letters,/ticker/SRPT,/ticker/CAPR,/pdufa/CAPR-deramiocel,/fda-decision/AAPG-2025-12-09,/fda-application,/drug/12-week-placebo-controlled,/research,/conferences,/adcomm,/coverage,/tickers,/glossary,/methodology,/sls').split(',');
var widths=(P.get('w')||'320,360,375,390,414,768').split(',').map(Number);
var jobs=[];pages.forEach(function(p){widths.forEach(function(w){jobs.push([p,w])})});
var out=[],box=document.getElementById('box'),i=0;
function next(){if(i>=jobs.length){document.getElementById('out').textContent='DONE '+jobs.length+' checks\n'+out.join('\n');return}
 var j=jobs[i++],f=document.createElement('iframe');f.width=j[1];f.height=700;box.innerHTML='';box.appendChild(f);
 var t=setTimeout(function(){out.push('TIMEOUT '+j[0]+' @'+j[1]);next()},20000);
 f.onload=function(){setTimeout(function(){clearTimeout(t);try{var d=f.contentDocument,W=d.documentElement.clientWidth,S=d.documentElement.scrollWidth,bad=[];
  if(S>W+1){d.querySelectorAll('body *').forEach(function(e){var r=e.getBoundingClientRect();if(r.right>W+1&&r.width>0){var inScroll=false,p=e.parentElement;while(p&&p!==d.body){var cs=getComputedStyle(p);if(/(auto|scroll|hidden)/.test(cs.overflowX)){inScroll=true;break}p=p.parentElement}if(!inScroll)bad.push(e.tagName.toLowerCase()+(e.id?'#'+e.id:'')+(e.className&&typeof e.className=='string'?'.'+e.className.split(' ')[0]:'')+'('+Math.round(r.right)+')')}})}
  var small=0;d.querySelectorAll('body *').forEach(function(e){if(e.children.length===0&&e.textContent.trim()){var fs=parseFloat(getComputedStyle(e).fontSize);if(fs<10&&e.getBoundingClientRect().width>0)small++}});
  out.push((S>W+1?'OVERFLOW ':'ok       ')+j[0]+' @'+j[1]+' scrollW='+S+' small<10px='+small+(bad.length?' :: '+bad.slice(0,6).join(' '):''));}catch(e){out.push('ERR '+j[0]+' '+e)}
  document.getElementById('out').textContent='running '+i+'/'+jobs.length+'\n'+out.join('\n');next()},700)};
 f.src=j[0];}
next();}
</script></body></html>
